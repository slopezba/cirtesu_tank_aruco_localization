aruco_map_localization:
  ros__parameters:
    alpha_pos: 0.4
    alpha_yaw: 0.3

    sigma_dist: 1.0
    aruco_yaw_offset: 0.0

    world_frame: world_enu
    marker_frame: cirtesu_tank
    base_frame: cirtesub/base_link
    camera_frame: cirtesub/down_camera/camera

    aruco_topic: /cirtesub/down_camera/aruco_detections
    marker_topic: /cirtesub/aruco/markers
    pose_topic: /cirtesub/sensors/aruco/pose_enu

    mesh_path: package://cirtesu_tank_aruco_localization/meshes/cirtesu.dae

    mesh_scale: [1.0, 1.0, 1.0]
    mesh_pos: [0.0, 0.0, 0.2]
    mesh_yaw: 0.0

    aruco_map:
      "0": [-1.35, 3.0, 5.0]
      "1": [-4.35, -3.0, 5.0]
      "2": [1.65, 0.0, 5.0]
      "3": [1.65, 3.0, 5.0]
      "4": [-1.35, 0.0, 5.0]
      "5": [-4.35, 3.0, 5.0]
      "6": [-4.35, 0.0, 5.0]
      "7": [-1.35, -3.0, 5.0]
      "8": [1.65, -3.0, 5.0]
